server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  charset utf-8;

  # Cloud Run terminates TLS; every request reaching here arrived over HTTPS.
  include /etc/nginx/security-headers.conf;

  # The download page (version, requirements, install help) ...
  location = /download {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=300" always;
    try_files /download.html =404;
  }
  # ... and the newest published DMG; release.sh publish keeps this alias current.
  location = /download/mac {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store" always;
    return 302 https://storage.googleapis.com/lima-updates-940267100054/stable/Lima.dmg;
  }

  # (Cloud Run reserves paths ending in "z", so not /healthz.)
  location = /health { access_log off; return 200 "ok\n"; }

  # Text for AI assistants and crawlers.
  location ~ ^/(llms\.txt|robots\.txt|sitemap\.xml)$ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
    types { text/plain txt; application/xml xml; }
    charset utf-8;
  }

  # Shared notes: the note is in the link's fragment, so the server only ever
  # serves this one page. Not indexed.
  location = /n {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files /n.html =404;
  }

  error_page 404 /404.html;
  location = /404.html { include /etc/nginx/security-headers.conf; internal; }

  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=300" always;
    try_files $uri $uri.html $uri/ =404;
  }
}
