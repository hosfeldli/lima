<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Shared note · Lima</title>
  <link rel="icon" href="/lima.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/note.css">
  <script type="module" src="/note-view.js"></script>
</head>
<body class="shared-note">
  <header class="shared-head">
    <a class="brand" href="/" aria-label="Lima"><img src="/lima.svg" alt="" width="24" height="24"><span>Lima</span></a>
    <span class="shared-tag">Shared note · read only</span>
  </header>
  <main class="shared-sheet" id="note" aria-live="polite">
    <p class="shared-empty">Opening the note…</p>
  </main>
  <footer class="shared-foot">
    <p>This note travels inside its link: Lima never uploaded it, and this page only reads it in your browser. Anyone with the link can read it.</p>
    <p><a href="/">Lima</a> is a free Mac browser where your AI agents work in plain sight.</p>
  </footer>
</body>
</html>
