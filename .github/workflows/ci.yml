name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
      - name: Lint shell scripts
        run: shellcheck --severity=warning browser/scripts/*.sh browser/scripts/release/*.sh
      - name: Compile Python tools
        run: python3 -m py_compile browser/scripts/lima_codesign.py browser/scripts/bundle_ui.py

  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Version files agree
        run: browser/scripts/release/release.sh check
      - name: Native tests
        run: swift test --package-path native
      - name: Repack, sign (ad-hoc) and verify Lima.app
        # Same signer and verifier as a release, so entitlement or hardened-runtime
        # regressions fail here instead of on release day.
        env:
          GH_TOKEN: ${{ github.token }}
        run: browser/scripts/repack.sh
