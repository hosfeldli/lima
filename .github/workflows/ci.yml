name: CI

# Lint runs on Linux for every change. macOS minutes count 10x on a private
# repo, so native tests run only when native code changes, and the signed
# repack check only when signing or packaging inputs change.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      native: ${{ steps.diff.outputs.native }}
      packaging: ${{ steps.diff.outputs.packaging }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$EVENT" == workflow_dispatch ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            files="$(git ls-files)"
          else
            files="$(git diff --name-only "$BASE" HEAD)"
          fi
          grep -qE '^native/' <<<"$files" && echo "native=true" >> "$GITHUB_OUTPUT" || echo "native=false" >> "$GITHUB_OUTPUT"
          grep -qE '^(browser/scripts/|browser/launcher/|browser/(lima\.lock|release|vendor-assets)\.json|native/Sources/LimaHost/|\.github/workflows/ci\.yml)' <<<"$files" \
            && echo "packaging=true" >> "$GITHUB_OUTPUT" || echo "packaging=false" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
      - name: Lint shell scripts
        run: shellcheck --severity=warning browser/scripts/*.sh browser/scripts/release/*.sh site/deploy.sh
      - name: Compile Python tools
        run: python3 -m py_compile browser/scripts/lima_codesign.py browser/scripts/bundle_ui.py
      - name: Check JavaScript syntax
        run: |
          for f in browser/overlay/lima/*.sys.mjs browser/overlay/lima/actors/*.sys.mjs browser/overlay/lima/ui/*.sys.mjs; do
            node --check --input-type=module < "$f" || { echo "syntax error in $f"; exit 1; }
          done
          for f in browser/overlay/lima/ui/*.js site/public/*.js; do node --check "$f"; done
      - name: Check Lima visual activity
        run: node --test browser/tests/visual-state.test.mjs

  native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Native tests
        run: swift test --package-path native

  packaging:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Version files agree
        run: browser/scripts/release/release.sh check
      - name: Repack, sign (ad-hoc) and verify Lima.app
        # Same signer and verifier as a release, so entitlement or hardened-runtime
        # regressions fail here instead of on release day.
        env:
          GH_TOKEN: ${{ github.token }}
        run: browser/scripts/repack.sh
