name: browser-repack
# Development build: pinned Zen release + Lima overlay. Manual to save macOS minutes.
on: workflow_dispatch
# Read-only token; actions pinned to commits like the release workflows.
permissions:
  contents: read
jobs:
  repack:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { submodules: false, persist-credentials: false }
      - run: browser/scripts/repack.sh
        env: { GH_TOKEN: "${{ github.token }}" }
      - run: ditto -c -k --keepParent build/Lima.app build/Lima-dev.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: Lima-dev, path: build/Lima-dev.zip }
