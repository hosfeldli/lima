name: Browser source build

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: macOS architecture to compile
        required: true
        type: choice
        options:
          - arm64
          - x86_64

permissions:
  contents: read

concurrency:
  group: browser-source-${{ github.ref }}-${{ inputs.architecture }}
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ${{ inputs.architecture == 'x86_64' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install source build tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install gnu-tar node@22
      - name: Compile pinned Gecko and Zen
        env:
          LIMA_SOURCE_JOBS: "3"
          LIMA_BUILD_DIR: ${{ github.workspace }}/build/source
        run: |
          node_prefix="$(brew --prefix node@22)"
          export PATH="$node_prefix/bin:$PATH"
          browser/scripts/build-source.sh
      - name: Verify browser and native runtime
        run: |
          swift test --package-path native
          python3 browser/scripts/source_smoke.py build/source/Lima.app
          ditto -c -k --sequesterRsrc --keepParent build/source/Lima.app build/source/Lima-source.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Lima-source-${{ inputs.architecture }}
          path: build/source/Lima-source.zip
          if-no-files-found: error
