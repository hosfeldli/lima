<!doctype html>
<html lang="en">

<title>Install Lima</title>
<style>
  :root { color-scheme: light dark; font: 15px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; }
  body { margin: 0; padding: 32px; background: light-dark(#f5f5f5, #18181a); color: light-dark(#242424, #eee); }
  main { box-sizing: border-box; max-width: 520px; margin: 10vh auto 0; padding: 28px; border: 1px solid light-dark(#dadada, #414144);
    border-radius: 14px; background: light-dark(#fff, #232326); }

  ol { padding-inline-start: 20px; margin-block: 0; }
  li + li { margin-block-start: 8px; }

<main>
  <h1>Install Lima</h1>
  <ol>
    <li>Drag <strong>Lima</strong> into <strong>Applications</strong> in the disk image window.</li>
    <li>Open <strong>Lima</strong> from Applications.</li>
    <li>Eject the installer disk image.</li>
  </ol>
</main>
