; Lima Browser application identity, loaded by the Lima launcher via -app.
; Keeps a profile separate from Zen and from Lima 4.x's data folder.
[App]
Vendor=Lima
Name=Lima
RemotingName=lima
Version=@LIMA_VERSION@
Profile=Lima Browser
BuildID=@BUILD_ID@
SourceRepository=https://github.com/hosfeldli/lima
SourceStamp=@SOURCE_STAMP@
ID={ec8030f7-c20a-464f-9b0e-13a3a9e97384}

[Gecko]
MinVersion=@GECKO_VERSION@
MaxVersion=@GECKO_VERSION@

[XRE]
EnableProfileMigrator=1
