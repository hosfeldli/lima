// Lima Browser bootstrap. The first line of this file must be a comment.
// Maps resource://lima/ to Contents/Resources/lima and starts Lima chrome.
lockPref("zen.welcome-screen.seen", true);
lockPref("zen.welcome-screen.always-show", false);
lockPref("zen.updates.show-update-notification", false);
lockPref("zen.watermark.enabled", false);
lockPref("browser.aboutwelcome.enabled", false);
lockPref("browser.shell.checkDefaultBrowser", false);
lockPref("startup.homepage_welcome_url", "");
lockPref("startup.homepage_welcome_url.additional", "");
lockPref("startup.homepage_override_url", "");

try {
  Services.prefs.setStringPref("zen.updates.last-build-id", Services.appinfo.appBuildID);
  const limaDir = Services.dirsvc.get("GreD", Ci.nsIFile);
  limaDir.append("lima");
  Services.io
    .getProtocolHandler("resource")
    .QueryInterface(Ci.nsIResProtocolHandler)
    .setSubstitution("lima", Services.io.newFileURI(limaDir));
  ChromeUtils.importESModule("resource://lima/LimaStartup.sys.mjs").LimaStartup.init();
} catch (error) {
  Cu.reportError(error);
  dump(`[lima] bootstrap failed: ${error}\n${error.stack}\n`);
}

// Lima ships its own updater; never let Zen's replace this build.
// The DisableAppUpdate policy stops Firefox's update service; these keep its
// background task, staging and post-update pages off too. Lima's updater
// (lima-host, LimaUpdates.sys.mjs) is the only one that runs.
lockPref("app.update.auto", false);
lockPref("app.update.enabled", false);
lockPref("app.update.background.enabled", false);
lockPref("app.update.background.scheduling.enabled", false);
lockPref("app.update.staging.enabled", false);
lockPref("app.update.service.enabled", false);
lockPref("app.update.doorhanger", false);
lockPref("browser.startup.homepage_override.mstone", "ignore");
lockPref("zen.workspaces.swipe-actions", false);
lockPref("zen.workspaces.force-container-workspace", false);

// Lima Search (⌘T) shows live web suggestions from the default engine.
// Zen ships them off; Lima turns them on by default (Settings → Search to opt out).
defaultPref("browser.search.suggest.enabled", true);

// Lima shows downloads in its own sidebar rail panel, not Zen's animation
// or Firefox's auto-opening downloads panel.
lockPref("zen.downloads.download-animation", false);
lockPref("browser.download.alwaysOpenPanel", false);
defaultPref("browser.download.autohideButton", true);

// One browser layout: the address bar across the top of the page, with the
// sidebar beside it (Zen's "multiple toolbars"). Zen's single-toolbar layout,
// with the address in the sidebar, isn't offered.
lockPref("zen.view.use-single-toolbar", false);

// The extensions button and copy-link button stay in view beside the address
// (Zen hides the first behind its site panel and fades the second until hover).
defaultPref("zen.theme.hide-unified-extensions-button", false);

// Memory. One process per site for its tabs (Firefox allows several), tabs
// unloaded when macOS is low on memory, and fewer whole pages kept for Back.
// Lima also unloads tabs you haven't used in 30 minutes (LimaMemory).
defaultPref("dom.ipc.processCount.webIsolated", 1);
defaultPref("browser.tabs.unloadOnLowMemory", true);
defaultPref("browser.sessionhistory.max_total_viewers", 4);
defaultPref("lima.tabs.unloadAfterMinutes", 30);
// One spare process kept warm for new tabs, not three.
defaultPref("dom.ipc.processPrelaunch.fission.number", 1);

// Picture-in-Picture: a playing video with sound follows you when you switch
// tabs, and goes back when you return. Silent videos (previews, ads) and very
// short clips stay put. The player has close and back-to-tab buttons (kept in
// view by lima.css) and drags anywhere.
defaultPref("media.videocontrols.picture-in-picture.enabled", true);
defaultPref("media.videocontrols.picture-in-picture.enable-when-switching-tabs.enabled", true);
defaultPref("media.videocontrols.picture-in-picture.video-toggle.min-video-secs", 20);
